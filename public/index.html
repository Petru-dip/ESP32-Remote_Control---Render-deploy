<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Control Brad 🎄</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="card">
    <h1>Control Brad 🎄</h1>
    <p>Controlează instalația din brad (2 LED-uri) cu moduri diferite de lumini.</p>

    <div class="led-section">
      <div class="led-header">
        <h2>LED 1</h2>
        <span id="led1-state" class="led-state-text">–</span>
      </div>
      <div class="btn-row">
        <button data-led="1" data-mode="off">Off</button>
        <button data-led="1" data-mode="on">On</button>
        <button data-led="1" data-mode="blink">Blink</button>
        <button data-led="1" data-mode="fade">Fade</button>
        <button data-led="1" data-mode="sparkle">Sparkle</button>
      </div>
      <div class="slider-row">
        <label for="led1-intensity">
          Intensitate: <span id="led1-intensity-label">255</span>
        </label>
        <input type="range" id="led1-intensity" min="0" max="255" value="255">
      </div>
    </div>

    <div class="led-section">
      <div class="led-header">
        <h2>LED 2</h2>
        <span id="led2-state" class="led-state-text">–</span>
      </div>
      <div class="btn-row">
        <button data-led="2" data-mode="off">Off</button>
        <button data-led="2" data-mode="on">On</button>
        <button data-led="2" data-mode="blink">Blink</button>
        <button data-led="2" data-mode="fade">Fade</button>
        <button data-led="2" data-mode="sparkle">Sparkle</button>
      </div>
      <div class="slider-row">
        <label for="led2-intensity">
          Intensitate: <span id="led2-intensity-label">255</span>
        </label>
        <input type="range" id="led2-intensity" min="0" max="255" value="255">
      </div>
    </div>

    <div class="program-row">
      <label for="program-select">Program global (opțional)</label>
      <select id="program-select">
        <option value="none">Niciun program</option>
        <option value="alternate">Alternare LED1 / LED2</option>
      </select>
    </div>

    <button class="apply-btn" id="apply-btn">Trimite configurarea</button>

    <div class="status" id="status"></div>
    <div class="status" id="esp-state"></div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
